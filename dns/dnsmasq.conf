# ============================================================
# dnsmasq configuration — Computer Networks Project
# Mac 1 — Private DNS Server
#
# This file is maintained by scripts/mac1-update-dns.sh.
# The listen-address, interface, and address= lines are
# patched automatically from .env — do not edit them by hand.
# ============================================================

# --- Network interface (patched from DNS_INTERFACE in .env) ---
interface=__DNS_INTERFACE__

# --- Listen on loopback + LAN IP (patched from MAC_IP_1_DNS in .env) ---
listen-address=127.0.0.1,__MAC_IP_1_DNS__

# --- Do not forward plain hostnames to upstream ---
domain-needed

# --- Do not forward queries for private IP ranges ---
bogus-priv

# --- Do not read /etc/hosts ---
no-hosts

# --- Project domain A-records (patched from MAC_IP_2_NGINX_LOAD_BALANCER in .env) ---
address=/__APP_DOMAIN__/__MAC_IP_2_NGINX_LOAD_BALANCER__
address=/__API_DOMAIN__/__MAC_IP_2_NGINX_LOAD_BALANCER__
