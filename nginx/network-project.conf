# ============================================================
# NGINX configuration — Computer Networks Project
# Mac 2 — Reverse Proxy / Load Balancer
#
# This file is maintained by scripts/mac2-update-nginx.sh.
# The server lines inside upstream backend_pool are patched
# automatically from .env — do not edit them by hand.
# ============================================================

# ---- Upstream backend pool (patched from .env) ----
upstream backend_pool {
    server 10.7.21.15:3001;
    server 10.7.5.213:3002;
}

# ---- HTTPS server ----
server {
    listen 8443 ssl;
    server_name app.team1.test api.team1.test;

    # Self-signed certificate — generated by mac2-update-nginx.sh if missing
    ssl_certificate     __BREW_PREFIX__/etc/nginx/ssl/team1.crt;
    ssl_certificate_key __BREW_PREFIX__/etc/nginx/ssl/team1.key;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # ---- Proxy to backend pool ----
    location / {
        proxy_pass         http://backend_pool;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
